<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Bytes to the caller versus dataset size</title>
<desc id="d">10,000 rows: rows as JSON 877,653 B, protocol bytes 3,730 B; 100,000 rows: rows as JSON 8,879,634 B, protocol bytes 3,731 B; 1,000,000 rows: rows as JSON 89,794,093 B, protocol bytes 3,732 B; 10,000,000 rows: rows as JSON 907,936,490 B, protocol bytes 3,734 B; 100,000,000 rows: rows as JSON 9,179,443,674 B, protocol bytes 3,739 B</desc>
<style>
  .bg { fill: #fcfcfb } .t1 { fill: #0b0b0b } .t2 { fill: #52514e } .grid { stroke: #e4e3df } .axis { stroke: #8f8e88 }
  .s1 { stroke: #2a78d6 } .s1f { fill: #2a78d6 } .s2 { stroke: #eb6834 } .s2f { fill: #eb6834 } .ring { stroke: #fcfcfb }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19 } .t1 { fill: #f0efec } .t2 { fill: #c3c2b7 } .grid { stroke: #333331 } .axis { stroke: #6d6c66 }

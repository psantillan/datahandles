  }
</style>
<rect class="bg" width="720" height="380" rx="6"/>
<text class="t1" x="92" y="26" font-size="15" font-weight="600">One question, five operations: bytes that reach the caller</text>
<text class="t2" x="92" y="44" font-size="12">Log scales. The dataset grows 10,000 times. The protocol bytes grow by 9 bytes.</text>

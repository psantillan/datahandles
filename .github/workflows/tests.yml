name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the lowest versions that pyproject.toml declares
          - python: "3.11"
            deps: "duckdb==1.0.0 mcp==2.1.0 pytest==8.0.0 playwright==1.65.2"
          # the newest versions
          - python: "3.12"
            deps: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" ${{ matrix.deps }}
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: python -m pytest tests -q

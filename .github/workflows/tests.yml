name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the lowest versions that pyproject.toml declares
          - python: "3.11"
            deps: "duckdb==1.0.0 mcp==2.1.0 pytest==8.0.0 playwright==1.65.2"
          # the newest versions
          - python: "3.12"
            deps: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" ${{ matrix.deps }}
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: python -m pytest tests -q

  # A plain install (not editable) must carry the protocol schemas. The import runs outside the repository.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv "$RUNNER_TEMP/venv"
      - run: '"$RUNNER_TEMP/venv/bin/pip" install .'
      - run: '"$RUNNER_TEMP/venv/bin/python" -c "import datahandles, datahandles.core.schema as s; assert len(s._SCHEMAS) == 6, s._SCHEMAS.keys(); print(datahandles.__file__)"'
        working-directory: ${{ runner.temp }}
